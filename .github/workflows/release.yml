name: Draft GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate
        run: python tools/validate_mod.py
      - name: Build
        run: dotnet build Source/PublicTransit/PublicTransit.csproj -c Release
      - name: Package
        shell: pwsh
        run: python tools/package_mod.py --version "$env:GITHUB_REF_NAME"
      - name: Create draft release (manual approval before publishing)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PublicTransit-*.zip
          draft: true
          generate_release_notes: true
